[project]
name = "planning-wiki-docs"
version = "0.1.0"
description = "MkDocs site for the trip-organizer planning wiki"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
docs = [
    "mdx-truly-sane-lists>=1.3",
    "mkdocs==1.6.1",
    "mkdocs-awesome-nav>=3.3.0",
    "mkdocs-callouts>=1.17.1",
    "mkdocs-glightbox>=0.5.2",
    "mkdocs-material==9.6.14",
    "pymd-gadgets>=0.1.0",
]

[tool.uv]
default-groups = ["docs"]

[tool.pytest.ini_options]
testpaths = ["spikes"]
pythonpath = ["spikes/end-to-end"]
addopts = "--import-mode=importlib"
