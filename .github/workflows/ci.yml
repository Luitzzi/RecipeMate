name: ci

on:
  push:
    paths-ignore:
      - docs/**
      - mkdocs.yml
  pull_request:
    paths-ignore:
      - docs/**
      - mkdocs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: recipemate
          POSTGRES_USER: recipemate
          POSTGRES_PASSWORD: recipemate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipemate -d recipemate"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: recipemate
      POSTGRES_USER: recipemate
      POSTGRES_PASSWORD: recipemate
      # Dummy values: the application context requires them, the tests do not call the external services
      ANTHROPIC_API_KEY: ci-dummy
      CLOUDFLARE_R2_ACCOUNT_ID: ci-dummy
      CLOUDFLARE_R2_ACCESS_KEY: ci-dummy
      CLOUDFLARE_R2_SECRET_KEY: ci-dummy
      CLOUDFLARE_R2_BUCKET_NAME: ci-dummy
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Compiles, generates frontend/src/generated/interface-api.ts (process-classes) and runs all tests
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: interface-api
          path: frontend/src/generated/interface-api.ts
          if-no-files-found: error
          retention-days: 1

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: interface-api
          path: frontend/src/generated
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Type check (tsc -b) and production build
      - run: npm run build
