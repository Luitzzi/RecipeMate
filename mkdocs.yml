site_name: RecipeMate
site_url: https://recipe.mate-universe.de/docs/
repo_url: https://github.com/Luitzzi/RecipeMate/
repo_name: RecipeMate
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

plugins:
  - awesome-nav
  - callouts
  - glightbox
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - mdx_truly_sane_lists:
      nested_indent: 2
      truly_sane: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.magiclink
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist
  - pymd_gadgets.compact_lists
  - pymd_gadgets.yamltable
  - tables
  - toc:
      permalink: true

extra_javascript:
  - _javascripts/mathjax.js
  - _javascripts/mathjax/tex-mml-chtml.js
